services:
  # libsql server (sqld) - persistent SQLite-compatible database
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    ports:
      - "8080:8080"
    volumes:
      - libsql_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Worklog webapp
  webapp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - LIBSQL_URL=http://sqld:8080
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-secret-at-least-16-chars}
      - PORT=3000
    depends_on:
      sqld:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  libsql_data:
